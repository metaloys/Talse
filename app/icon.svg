<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Talse app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A3BE0"/>
      <stop offset="0.55" stop-color="#5A21B8"/>
      <stop offset="1" stop-color="#2B0E5E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#C4A2FF" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#C4A2FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#C4A2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9D8FF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.5" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#F29A1F"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>

  <!-- Monogram: a bold T whose bar and stem meet as an exchange joint -->
  <rect x="252" y="258" width="520" height="148" rx="74" fill="url(#mark)"/>
  <rect x="448" y="354" width="128" height="412" rx="64" fill="url(#mark)"/>

  <!-- Gold spark: the "opportunity" accent -->
  <path d="M792 168 L816 222 L870 246 L816 270 L792 324 L768 270 L714 246 L768 222 Z" fill="url(#gold)"/>

  <!-- Exchange chevron at the base of the stem -->
  <path d="M470 792 l42 44 42 -44" fill="none" stroke="url(#gold)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
</svg>
